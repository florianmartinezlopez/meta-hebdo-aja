<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meta Hebdo 40K</title>
<meta name="description" content="@@DESCRIPTION@@">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout : briefing de team en une colonne, nav collante par section, cartes par armée en grille 2 colonnes qui passe en 1 sur mobile */
:root{
  --bg:#eef0f3; --surface:#fbfcfd; --ink:#15181e; --muted:#5b6370; --line:#d5d9e0; --soft:#e3e6eb;
  --accent:#b3261e; --good:#1f7a4d; --bad:#b3261e; --warn:#a86a00;
  --d-th:#2f5d9e; --d-ptf:#b3261e; --d-pa:#a86a00; --d-rec:#1f7a4d; --d-dis:#6b3fa0;
  --display:"Saira Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
@@COULEURS_CLAIR@@
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111419; --surface:#181c23; --ink:#e8ebf0; --muted:#98a1ae; --line:#2c323c; --soft:#222831;
  --accent:#ef6a5f; --good:#4cc28a; --bad:#ef6a5f; --warn:#e3a53a;
  --d-th:#6f9be0; --d-ptf:#ef6a5f; --d-pa:#e3a53a; --d-rec:#4cc28a; --d-dis:#a982dc;
@@COULEURS_SOMBRE@@
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111419; --surface:#181c23; --ink:#e8ebf0; --muted:#98a1ae; --line:#2c323c; --soft:#222831;
  --accent:#ef6a5f; --good:#4cc28a; --bad:#ef6a5f; --warn:#e3a53a;
  --d-th:#6f9be0; --d-ptf:#ef6a5f; --d-pa:#e3a53a; --d-rec:#4cc28a; --d-dis:#a982dc;
@@COULEURS_SOMBRE@@
  color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.wrap{max-width:1100px;margin:0 auto;padding-inline:14px;padding-block:20px 56px}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:.01em;text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(2.4rem,6vw,3.6rem);font-weight:800;text-transform:uppercase}
h2{font-size:1.6rem;text-transform:uppercase}
h3{font-size:1.35rem}
p{margin:0}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}

header.top{display:grid;gap:14px;padding-bottom:22px;border-bottom:3px solid var(--ink)}
.stamp{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline}
.stamp .eyebrow b{color:var(--ink);font-weight:500}
.coverage{display:flex;flex-wrap:wrap;gap:10px}
.chip{font-family:var(--mono);font-size:.78rem;padding:4px 9px;border:1px solid var(--line);border-radius:3px;background:var(--surface)}
.chip.warn{border-color:var(--warn);color:var(--warn)}

nav.sec{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin-bottom:8px}
nav.sec .links{display:flex;gap:4px;overflow-x:auto;padding-block:10px}
nav.sec .bar{display:none;align-items:center;gap:10px;padding-block:8px}
nav.sec.collapsed .bar{display:flex}
nav.sec.collapsed .links{display:none}
nav.sec.collapsed.open .links{display:grid;gap:2px;padding-block:4px 12px}
nav.sec.collapsed.open .links a{padding:10px 8px;font-size:1.15rem}
nav.sec .links a.on{color:var(--ink);background:var(--soft)}
#burger{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);cursor:pointer}
#burger:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav.sec .cur{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:1.1rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav.sec .wk{flex:none}
nav.sec a{font-family:var(--display);font-weight:700;text-transform:uppercase;font-size:1rem;color:var(--muted);text-decoration:none;padding:4px 10px;border-radius:3px;white-space:nowrap}
nav.sec a:hover,nav.sec a:focus-visible{color:var(--ink);background:var(--soft);outline:none}

section{padding-top:40px;display:grid;gap:18px;scroll-margin-top:56px;min-width:0}
.sec-head{display:grid;gap:6px}
.sec-head p{max-width:68ch;color:var(--muted)}

.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.take{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.take .k{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase}
.take p{font-size:.95rem}

.armies{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr));gap:16px}
.army{background:var(--surface);border:1px solid var(--line);border-top:5px solid var(--fc);border-radius:4px;padding:14px;display:grid;gap:16px;align-content:start;min-width:0}
.army-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.army-h h3{font-size:1.6rem;text-transform:uppercase}
.kpis{display:flex;gap:10px 14px;flex-wrap:wrap}
.kpi{display:grid}
.kpi .v{font-family:var(--mono);font-size:1.15rem;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.read{font-size:.93rem;border-left:3px solid var(--fc);padding-left:10px}
.sub{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}

table{width:100%;border-collapse:collapse;font-size:.88rem}
th{white-space:nowrap;overflow-wrap:normal;font-family:var(--mono);font-weight:500;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:left;padding:4px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--soft);vertical-align:middle}
.cell-sub{display:block;font-weight:400;font-size:.78rem;color:var(--muted);margin-top:3px;line-height:1.35}
.hide-m{display:none}
td.r,th.r{text-align:right}
td.num,td .num,.wrbar{white-space:nowrap;overflow-wrap:normal}
.tscroll{overflow-x:auto}
.det{min-width:0}
.wrbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.wrbar .track{position:relative;width:52px;height:8px;background:var(--soft);border-radius:2px;flex:none}
.wrbar .track::after{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--muted)}
.wrbar .fill{position:absolute;top:0;bottom:0;border-radius:2px}
.na{color:var(--muted);font-family:var(--mono);font-size:.78rem}

.fdbar{display:flex;height:22px;border-radius:3px;overflow:hidden;gap:2px}
.fdbar span{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:.68rem;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:.78rem;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.lists{display:grid;gap:6px}
.li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:.86rem;padding:7px 0;border-bottom:1px dashed var(--line)}
.li:last-child{border-bottom:0}
.rec{font-family:var(--mono);font-weight:500;grid-row:span 2;align-self:center;padding:3px 7px;border-radius:3px;background:var(--soft);font-size:.82rem;min-width:46px;text-align:center}
.rec.x0{background:var(--good);color:#fff}
.li .who{font-weight:600}
.li .what{color:var(--muted);font-size:.8rem}
.fd{display:inline-block;font-family:var(--mono);font-size:.66rem;letter-spacing:.04em;padding:1px 6px;border-radius:2px;color:#fff;vertical-align:1px;margin-right:4px;white-space:nowrap}
.empty{font-size:.85rem;color:var(--muted)}
a{color:inherit;text-decoration-color:var(--line);text-underline-offset:2px}
a:hover{text-decoration-color:currentColor}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.fd-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.fdcard{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--dc);border-radius:4px;padding:14px;display:grid;gap:12px;align-content:start;min-width:0}
.fdcard-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fdcard-h .wr{font-family:var(--mono);font-size:1.4rem;font-weight:500}
.who-plays{display:grid;gap:4px}
.wp{display:grid;grid-template-columns:120px 1fr 28px;gap:8px;align-items:center;font-size:.82rem}
.wp .b{height:7px;background:var(--dc);border-radius:2px;opacity:.85}
.wp .team{font-weight:600}
.matrix td,.matrix th{padding-block:5px}

.emerg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.em{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:8px;align-content:start;min-width:0}
.sig{font-family:var(--mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;justify-self:start}
.sig.strong{background:var(--good);color:#fff}
.sig.watch{border:1px solid var(--warn);color:var(--warn)}
.sig.down{border:1px solid var(--muted);color:var(--muted)}
.em .arch{font-family:var(--display);font-weight:700;font-size:1.2rem;line-height:1.1}
.em p{font-size:.9rem}
.teamtag{font-family:var(--mono);font-size:.66rem;padding:1px 6px;border-radius:2px;border:1px solid var(--ink);margin-left:6px;vertical-align:2px;white-space:nowrap}

.army,.fdcard,.em,.take{grid-template-columns:minmax(0,1fr)}
.army>*,.fdcard>*,.em>*{min-width:0}
.rowteam td:first-child{font-weight:600}
.note{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:16px;display:grid;gap:8px;font-size:.88rem}
.note ul{margin:0;padding-left:18px;display:grid;gap:4px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);font-size:.8rem;color:var(--muted);display:grid;gap:4px}
@media (max-width:520px){
  .wp{grid-template-columns:104px 1fr 24px}
  nav.sec a{font-size:.95rem;padding:6px 9px}
}
@media (min-width:720px){
  .wrap{padding-inline:24px;padding-block:28px 64px}
  h2{font-size:1.9rem}
  .army,.fdcard{padding:18px}
  .kpis{gap:16px}
  td{padding:7px 6px} th{padding-inline:6px}
  .wrbar .track{width:90px}
  .hide-m{display:table-cell}
}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
</style>
</head>
<body>
<div class="wrap">
@@CONTENU@@
</div>
<script>
/* navigation : la barre se replie en burger au défilement */
(function(){
  const $=id=>document.getElementById(id);
  const nav=$('nav'), burger=$('burger'), cur=$('cur'), links=[...nav.querySelectorAll('.links a')];
  const setOpen=o=>{nav.classList.toggle('open',o);burger.setAttribute('aria-expanded',o);burger.setAttribute('aria-label',o?'Fermer le menu':'Ouvrir le menu');};
  burger.addEventListener('click',()=>setOpen(!nav.classList.contains('open')));
  links.forEach(a=>a.addEventListener('click',()=>setOpen(false)));
  document.addEventListener('keydown',e=>{if(e.key==='Escape')setOpen(false)});
  new IntersectionObserver(([e])=>{
    const c=!e.isIntersecting && e.boundingClientRect.top<0;
    nav.classList.toggle('collapsed',c); if(!c) setOpen(false);
  }).observe($('navsentinel'));
  const secs=links.map(a=>document.getElementById(a.getAttribute('href').slice(1))).filter(Boolean);
  const onScroll=()=>{
    let active=secs[0];
    for(const s of secs){ if(s.getBoundingClientRect().top<120) active=s; }
    links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+active.id));
    const l=links.find(a=>a.getAttribute('href')==='#'+active.id); if(l) cur.textContent=l.textContent;
  };
  addEventListener('scroll',onScroll,{passive:true}); onScroll();
})();
</script>
</body>
</html>
